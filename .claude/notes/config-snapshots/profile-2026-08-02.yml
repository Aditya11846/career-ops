# ── Comp — comp-first, effective-value in INR, not raw gross ───────────────
#
# Resolved direction: he'll remain India-tax-resident regardless of employer
# country, so "effective value" = FX-convert any stated comp to INR, then run
# through Indian income-tax slabs, producing one comparable net-INR number
# across a US/Germany/anywhere posting alike. See senior-search/compute-fit.mjs.
compensation:
  target_range: "comp-first — no fixed target ceiling; ranked by effective net-INR value, not raw gross"
  currency: "INR (effective value — see compute-fit.mjs)"
  minimum: ""
  location_flexibility: "Fully remote, any country — title and geography are not filters, only comp and domain fit"
  effective_value_notes: >
    Cash (base + guaranteed/target bonus) is the primary ranked number.
    Public-company RSUs are counted at a ~50% haircut (volatility/vesting-cliff
    risk). Private-company equity/options are informational only, NOT counted
    in the ranked value — priority is reliable income after an 18-month gap,
    not speculative upside.

location:
  country: "India"
  city: "Pune"
  timezone: "IST"
  visa_status: "Not seeking relocation or a work visa — remote employment only, physically based in India"
  onsite_availability: "None outside India. WITHIN India, hybrid based in Pune is acceptable (updated 2026-08-02) — do not treat an India-based hybrid-in-Pune posting as a geo mismatch. Hybrid/onsite requiring any other city, or any role outside India, is not viable."
  # This is the single most important practical filter for this search, more
  # important than comp: most "Remote" postings mean remote-within-country,
  # not remote-from-anywhere. See senior-search/compute-fit.mjs's
  # scoreIndiaHireability() — Permanent Establishment tax risk is the real
  # reason many employers restrict remote hiring to India; EOR providers
  # (Deel, Remote.com, Multiplier, Papaya, Rippling, Oyster) solve it and are
  # the strongest positive signal short of the company already having an
  # India entity.
  india_hireability_note: "See senior-search/compute-fit.mjs scoreIndiaHireability() — weighted confidence, not a binary filter."

language:
  output: en

spend_tier: standard

cv:
