# portals.yml — Amit Kumar Singh's company watchlist
#
# Scanned by the standard scan.mjs (no isolation wrapper needed — this is the
# only workspace in this checkout).
#
# Domain, per .claude/notes/brainstorm-2026-07-26.md's market-validated
# direction: Zero Trust / enterprise access security, endpoint encryption/DLP,
# embedded/kernel systems. Geography: none — borderless, comp-first.
#
# title_filter is deliberately left EMPTY: title doesn't matter for this
# search (comp + domain fit do). Do not add title keywords here.
title_filter:
  positive: []
  negative: []

# location_filter is deliberately left EMPTY for the same reason — geography
# is not a filter. India-hireability is scored separately as a weighted
# confidence signal (senior-search/compute-fit.mjs), not a location block.
location_filter:
  always_allow: []
  allow: []
  block: []

