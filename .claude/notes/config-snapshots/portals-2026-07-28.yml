    # server-rendered "similar jobs" widget linking several OTHER live
    # postings. providers/jsonld-jobposting.mjs's listing-discovery mode
    # (job_link_pattern) follows those links too. Real coverage, but narrower
    # than a full catalog scan — a handful of related postings per run, not
    # every open role at Continental. Confirmed live 2026-07-28.
    careers_url: "https://jobs.continental.com/en/detail-page/job-detail/REF94214D-p-d43f61f3e8578eefc3faa0c5f94d00ee/quality-engineer/"
    provider: jsonld-jobposting
    # NOT just "/detail-page/job-detail/" — the page also carries language-
    # switcher links to the SAME job under every locale (cz/de/es-es/fr/...),
    # which would eat the fetch budget on 14+ duplicates of one posting before
    # reaching genuinely different ones. Scoped to /en/ specifically; found
    # live 2026-07-28 by testing the unscoped pattern first and seeing this.
    job_link_pattern: "/en/detail-page/job-detail/"
    enabled: true
    notes: "Automotive/industrial embedded — bridge required from security/encryption embedded work to automotive, not a direct line. Confirmed custom portal; no true search-results page found server-rendered, but individual job pages link several related postings via a 'similar jobs' widget, which the new listing-discovery provider mode follows."

