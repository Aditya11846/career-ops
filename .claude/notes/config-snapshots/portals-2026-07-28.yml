    # JobPosting markup, confirmed live 2026-07-28.
    careers_url: "https://jobs.paloaltonetworks.com/en/search-jobs"
    provider: jsonld-jobposting
    job_link_pattern: "/en/job/"
    enabled: true
    notes: "Zero Trust / Prisma Access. Confirmed schema.org JobPosting via listing-discovery during 2026-07-28 research — the page is large but not a JS shell, real links are server-rendered."

