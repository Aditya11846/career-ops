# portals.yml — Amit Kumar Singh's company watchlist
#
# Scanned by the standard scan.mjs (no isolation wrapper needed — this is the
# only workspace in this checkout).
#
# Domain, per .claude/notes/brainstorm-2026-07-26.md's market-validated
# direction: Zero Trust / enterprise access security, endpoint encryption/DLP,
# embedded/kernel systems. Geography: none — borderless, comp-first.
#
# title_filter is deliberately left EMPTY: title doesn't matter for this
# search (comp + domain fit do). Do not add title keywords here.
title_filter:
  positive: []
  negative: []

# location_filter is deliberately left EMPTY for the same reason — geography
# is not a filter. India-hireability is scored separately as a weighted
# confidence signal (senior-search/compute-fit.mjs), not a location block.
location_filter:
  always_allow: []
  allow: []
  block: []

tracked_companies:
  # ── Confirmed ATS (safe to enable) ──────────────────────────────────────
  - name: Broadcom
    # Owns Symantec's former enterprise-security product lines (Amit's own
    # 2009-2018 employer, via acquisition). Confirmed on Workday during this
    # session's research (broadcom.wd1.myworkdayjobs.com).
    careers_url: "https://broadcom.wd1.myworkdayjobs.com/External_Career"
    provider: workday
    enabled: true
    notes: "Confirmed Workday tenant during 2026-07-27 research session. Owns Symantec Endpoint Encryption/DLP lineage."

  # ── Candidate companies — ATS NOT yet confirmed, disabled until verified ──
  # Verify each company's actual careers-page ATS (Workday/Greenhouse/Ashby/
  # Lever vs. none) before enabling — do not guess a careers_url/api. Flip
  # `enabled: true` and fill in `provider`/`careers_url` once confirmed, or
  # leave scan_method: websearch for an agent-handoff scan instead.

  - name: Zscaler
    careers_url: "https://job-boards.greenhouse.io/zscaler"
    provider: greenhouse
    enabled: true
    notes: "Zero Trust — direct competitor to Amit's current-era Akamai work. Confirmed Greenhouse during 2026-07-28 research."

  - name: Palo Alto Networks
    # jobs.paloaltonetworks.com/en/search-jobs is large (1.2MB) but genuinely
    # server-rendered — real <a href="/en/job/..."> links confirmed live in
    # the raw HTML, not just via JS. Individual job pages carry schema.org
    # JobPosting markup, confirmed live 2026-07-28.
    careers_url: "https://jobs.paloaltonetworks.com/en/search-jobs"
    provider: jsonld-jobposting
    job_link_pattern: "/en/job/"
    enabled: true
    notes: "Zero Trust / Prisma Access. Confirmed schema.org JobPosting via listing-discovery during 2026-07-28 research — the page is large but not a JS shell, real links are server-rendered."

  - name: Cloudflare
    careers_url: "https://job-boards.greenhouse.io/cloudflare"
    provider: greenhouse
    enabled: true
    notes: "Zero Trust product line. Confirmed Greenhouse (live API tested) during 2026-07-28 follow-up research — the earlier custom-portal guess was wrong."

  - name: Netskope
    # open-positions page is a JS shell loading Greenhouse's embed widget
    # (for=netskope) — the underlying standard Greenhouse board API call was
    # confirmed live 2026-07-28 (140 real postings), even though the page
    # itself has no server-rendered links.
    careers_url: "https://job-boards.greenhouse.io/netskope"
    api: "https://boards-api.greenhouse.io/v1/boards/netskope/jobs"
    provider: greenhouse
    enabled: true
    notes: "Zero Trust / SASE. Confirmed Greenhouse during 2026-07-28 research — the marketing page is a JS shell, but it's loading a standard Greenhouse board underneath."

  - name: CrowdStrike
    careers_url: "https://crowdstrike.wd5.myworkdayjobs.com/crowdstrikecareers"
    provider: workday
    enabled: true
    notes: "Endpoint security. Confirmed Workday tenant during 2026-07-28 research."

  - name: Check Point Software
    enabled: false
    notes: "Zero Trust + endpoint/disk encryption lineage overlap. Confirmed custom 'cpcareers' CMS at careers.checkpoint.com. Re-checked 2026-07-28: fetched a real live job page (joborderid=24651) — zero schema.org JobPosting markup either. Not scannable by any current provider, not just unconfirmed."
    scan_method: websearch
    scan_query: "Check Point Software careers principal staff engineer security"

  - name: Ivanti
    # The landing page (/company/careers) is marketing-only; the real listing
    # lives one hop away at /company/careers/find — server-rendered with real
    # links, confirmed live 2026-07-28. Individual job pages carry schema.org
    # JobPosting markup (confirmed: Senior Offensive Security Engineer).
    careers_url: "https://www.ivanti.com/company/careers/find"
    provider: jsonld-jobposting
    job_link_pattern: "/company/careers/job?gh_jid="
    enabled: true
    notes: "Zero Trust / endpoint management. Confirmed schema.org JobPosting via listing-discovery during 2026-07-28 research."

  - name: Citrix
    enabled: false
    notes: "Zero Trust / enterprise access. Tenant/site slug (citrix.wd1.myworkdayjobs.com/CitrixCareers) reconfirmed correct via real live posting URLs on 2026-07-28 follow-up — the jobs API still returns HTTP 422 even with a browser User-Agent/Referer added. This is a deeper block (likely a missing session cookie or a changed API path for this specific tenant), not a wrong slug — needs real debugging (e.g. inspect actual network requests in a browser), not more guessing."
    scan_method: websearch
    scan_query: "Citrix careers principal staff engineer security engineering"

  - name: Trellix
    careers_url: "https://trellix.wd1.myworkdayjobs.com/EnterpriseCareers"
    provider: workday
    enabled: true
    notes: "Endpoint/DLP lineage, direct overlap with Amit's Symantec DLP work. Renamed from 'McAfee (Trellix)' — McAfee's enterprise/security business merged into Trellix in 2021; Trellix is the current entity to track. Confirmed Workday tenant during 2026-07-28 research."

  - name: Digital Guardian
    # now "Fortra's Digital Guardian" (acquired) — standalone
    # site 403s/redirects into fortra.com. The human-facing careers page is a
    # JS shell, but its underlying Workday API works fine regardless (same as
    # Broadcom) — confirmed live 2026-07-28, 35 real postings.
    careers_url: "https://fortra.wd12.myworkdayjobs.com/FortraCareers"
    provider: workday
    enabled: true
    notes: "DLP specialist. Confirmed Workday API during 2026-07-28 research — the marketing page looked like a dead end (JS shell, no links) but the actual jobs API works the same way Broadcom's does, independent of the page's own rendering."

  - name: Proofpoint
    # Found via the watchlist-widening pass (G2's DLP category page), not the
    # original hand-picked list. Confirmed Workday during 2026-07-28 research,
    # 168 real postings tested live via the API.
    careers_url: "https://proofpoint.wd5.myworkdayjobs.com/ProofpointCareers"
    provider: workday
    enabled: true
    notes: "DLP/enterprise security, direct Symantec DLP lineage overlap. Confirmed Workday API during 2026-07-28 watchlist-widening research."

  - name: Sophos
    # sophos.com/en-us/careers is just a marketing page linking out — the real
    # board is a standard Lever board, confirmed live 2026-07-28.
    careers_url: "https://jobs.lever.co/sophos"
    provider: lever
    enabled: true
    notes: "Endpoint security. Confirmed Lever (jobs.lever.co/sophos) during 2026-07-28 research — the 'careers' page itself is just a marketing page that links out to it."

  - name: Thales (CipherTrust)
    careers_url: "https://thales.wd3.myworkdayjobs.com/Careers"
    provider: workday
    enabled: true
    notes: "Encryption/data-protection lineage overlap with Symantec Endpoint Encryption work. Confirmed Workday tenant during 2026-07-28 research."

  - name: Forcepoint
    careers_url: "https://forcepoint.wd1.myworkdayjobs.com/external-careers"
    provider: workday
    enabled: true
    notes: "DLP. Confirmed Workday tenant during 2026-07-28 research."

  - name: Wind River
    enabled: false
    notes: "Embedded RTOS specialist — direct overlap with Amit's kernel/embedded background (VxWorks experience specifically). Re-checked 2026-07-28: actually uses Jobvite (jobs.jobvite.com/windriver, not one of the 4 supported providers), but that path currently redirects to Jobvite's own marketing site rather than a live job board — couldn't reach a real listing to confirm further."
    scan_method: websearch
    scan_query: "Wind River careers principal staff embedded systems engineer"

  - name: Bosch
    enabled: false
    notes: "Automotive/industrial embedded — large employer, bridge required from security/encryption embedded work to automotive, not a direct line. Confirmed custom global portal at jobs.bosch.com. Re-checked 2026-07-28: the portal is a JS-rendered SPA shell with no job links in server-rendered HTML — couldn't extract a real posting URL to check for schema.org markup this pass."
    scan_method: websearch
    scan_query: "Bosch careers principal staff embedded systems engineer remote"

  - name: Continental
    # Not a true search-results listing (couldn't find one server-rendered) —
    # points at a real, known job detail page, which itself carries a
    # server-rendered "similar jobs" widget linking several OTHER live
    # postings. providers/jsonld-jobposting.mjs's listing-discovery mode
    # (job_link_pattern) follows those links too. Real coverage, but narrower
    # than a full catalog scan — a handful of related postings per run, not
    # every open role at Continental. Confirmed live 2026-07-28.
    careers_url: "https://jobs.continental.com/en/detail-page/job-detail/REF94214D-p-d43f61f3e8578eefc3faa0c5f94d00ee/quality-engineer/"
    provider: jsonld-jobposting
    # NOT just "/detail-page/job-detail/" — the page also carries language-
    # switcher links to the SAME job under every locale (cz/de/es-es/fr/...),
    # which would eat the fetch budget on 14+ duplicates of one posting before
    # reaching genuinely different ones. Scoped to /en/ specifically; found
    # live 2026-07-28 by testing the unscoped pattern first and seeing this.
    job_link_pattern: "/en/detail-page/job-detail/"
    enabled: true
    notes: "Automotive/industrial embedded — bridge required from security/encryption embedded work to automotive, not a direct line. Confirmed custom portal; no true search-results page found server-rendered, but individual job pages link several related postings via a 'similar jobs' widget, which the new listing-discovery provider mode follows."

  - name: Siemens
    enabled: false
    notes: "Industrial embedded. 2026-07-28 research found no single unified careers tenant for core Siemens AG — its divisions (e.g. Siemens Gamesa, Siemens Healthineers) each run separate Workday tenants. Re-checked 2026-07-28: found a real, current job detail page (jobs.siemens.com/en_US/externaljobs/JobDetail/478743, a live Cybersecurity Intern posting) confirming it's a custom portal, not Workday — no schema.org markup present either."
    scan_method: websearch
    scan_query: "Siemens careers principal staff embedded systems engineer remote"

  - name: secunet Security Networks
    enabled: false
    notes: "German VPN/Zero-Trust-adjacent government/enterprise security firm — cited as an example of 'relevant company anywhere,' not a Germany-specific priority. Confirmed during 2026-07-28 research: runs its own portal at jobs.secunet.com (also covers subsidiaries secunet international GmbH, stashcat GmbH), not one of the 4 supported providers."
    scan_method: websearch
    scan_query: "secunet Security Networks careers principal engineer VPN security"

  - name: Twingate
    careers_url: "https://jobs.lever.co/twingate"
    provider: lever
    enabled: true
    notes: "Zero Trust Network Access startup. Confirmed Lever during 2026-07-28 research."

# job_boards: intentionally empty for now — this search is company-watchlist-
# driven (curated, narrow domain), not board-driven (see brainstorm notes,
# "curated watchlist vs. open scanning" discussion).
job_boards: []
